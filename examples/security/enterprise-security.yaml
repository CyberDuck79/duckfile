version: 1

# Enterprise Security Configuration
# Comprehensive security policy for production environments

# Host access control - strict allowlist approach
allowedHosts:
  - github.com
  - gitlab.company.com
  - git.internal.company.com
  - bitbucket.company.com

# Comprehensive deny list of known threats
deniedHosts:
  - malicious-host.com
  - untrusted-repo.net
  - suspicious-git.com
  - compromised-host.org

# Strict mode required for enterprise
strictMode: true

# Comprehensive policy enforcement
enforcement:
  forceChecksumValidation: true     # All templates must have checksums
  forceCommitTracking: true         # All templates must track commits
  disableAutoUpdate: true           # Disable auto-updates for stability
  strictPolicyMode: true            # Require security config to exist

# Strict file permission validation
filePermissions:
  enforceOwnership: true            # Require proper file ownership
  enforceReadOnly: true             # Config files must be read-only
  allowGroupWrite: false            # No group write permissions
  requireSecureDirectories: true    # Parent directories must be secure

# Audit and compliance metadata
metadata:
  createdBy: "security-team"
  createdAt: "2025-08-31T10:00:00Z"
  purpose: "Enterprise production security policy"
  version: 2
  compliance:
    - "SOC2"
    - "ISO27001"
  reviewDate: "2026-02-28"
  approvedBy: "security-officer@company.com"