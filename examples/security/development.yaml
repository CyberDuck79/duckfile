# Development Environment Configuration  
# This configuration provides flexibility for development while maintaining basic security

version: 1

# Host access control (relaxed for development)
allowedHosts:
  - github.com
  - gitlab.com
  - bitbucket.org
strictMode: false

# Policy enforcement (relaxed for development)
enforcement:
  forceChecksumValidation: false   # Allow templates without checksums
  forceCommitTracking: false       # Allow autoUpdateOnChange=false
  disableAutoUpdate: false         # Allow auto-updates
  strictPolicyMode: false          # Security config is optional
  enforceFilePermissions: false    # Relaxed file permission validation

# File permission validation (relaxed)
filePermissions:
  enforceOwnership: false          # Don't enforce strict ownership in dev
  enforceReadOnly: false           # Allow modifications
  allowGroupWrite: true            # Allow group collaboration
  requireSecureDirectories: false  # Relaxed directory requirements

# Audit metadata
metadata:
  createdBy: "development-team"
  createdAt: "2025-08-31T10:00:00Z"
  purpose: "Development environment security"
  version: 1