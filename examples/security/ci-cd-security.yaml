version: 1

# CI/CD Security Configuration
# Maximum security for automated build environments

# Strict allowlist for CI/CD
allowedHosts:
  - github.com
  - gitlab.company.com
  - git.company.com

# Comprehensive deny list
deniedHosts:
  - malicious-host.com
  - untrusted-repo.net
  - suspicious-git.com
  - localhost           # No local repos in CI
  - "*.dev.company.com" # No dev repos in CI

# Strict mode mandatory for CI/CD
strictMode: true

# Maximum policy enforcement
enforcement:
  forceChecksumValidation: true     # Mandatory checksums in CI
  forceCommitTracking: true         # Mandatory commit tracking
  disableAutoUpdate: true           # No auto-updates in CI
  strictPolicyMode: true            # Security config required

# Maximum file permission enforcement
filePermissions:
  enforceOwnership: true            # Strict ownership in CI
  enforceReadOnly: true             # Read-only configs in CI
  allowGroupWrite: false            # No group write in CI
  requireSecureDirectories: true    # Secure directories required

# CI/CD audit metadata
metadata:
  createdBy: "ci-cd-team"
  createdAt: "2025-08-31T10:00:00Z"
  purpose: "CI/CD pipeline security policy"
  version: 1
  environment: "ci-cd"
  pipeline:
    - "GitHub Actions"
    - "GitLab CI"
    - "Jenkins"
  security:
    - "Zero-trust model"
    - "Immutable infrastructure"
    - "Audit logging enabled"