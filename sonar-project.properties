# SonarQube project configuration for duckfile
sonar.projectKey=CyberDuck79_duckfile
sonar.organization=cyberduck79

# Project metadata
sonar.projectName=duckfile
sonar.projectVersion=1.0

# Source configuration
sonar.sources=.
sonar.go.coverage.reportPaths=coverage.out

# Exclusions - exclude test files and other non-production code from analysis
# This fixes the code duplication issues caused by test helper functions
sonar.exclusions=**/*_test.go,**/test_*.go,**/testdata/**,**/vendor/**,**/*.md,**/*.yml,**/*.yaml,**/examples/**,**/docs/**,**/assets/**,**/.git/**,**/.duck/**

# Duplication exclusions - additional patterns for test-related duplications
sonar.cpd.exclusions=**/*_test.go,**/test_*.go

# Coverage exclusions - exclude specific files mentioned in copilot instructions
sonar.coverage.exclusions=internal/run/test_seams.go,cmd/duck/wizard.go,cmd/duck/init.go,cmd/duck/add.go

# Quality gate settings
sonar.qualitygate.wait=true
