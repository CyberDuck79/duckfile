# SonarQube project configuration for duckfile
sonar.projectKey=CyberDuck79_duckfile
sonar.organization=cyberduck79

# Project metadata
sonar.projectName=duckfile
sonar.projectVersion=1.0

# Source configuration
sonar.sources=cmd,internal

# Explicitly classify tests
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage
sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=internal/run/test_seams.go,cmd/duck/wizard.go,cmd/duck/init.go,cmd/duck/add.go

# Exclusions for non-production artifacts
sonar.exclusions=**/testdata/**,**/vendor/**,**/*.md,**/*.yml,**/*.yaml,**/examples/**,**/docs/**,**/assets/**,**/.git/**,**/.duck/**

# Exclude tests from duplication (belt-and-suspenders)
sonar.cpd.exclusions=**/*_test.go

# Duplication exclusions - additional patterns for test-related duplications
sonar.cpd.exclusions=**/*_test.go,**/test_*.go

# Quality gate settings
sonar.qualitygate.wait=true
