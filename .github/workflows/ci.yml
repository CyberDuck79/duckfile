name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      
      - name: Install dependencies
        run: go mod download

      - name: Run unit tests with coverage
        run: |
          go test -race ./... -count=1 -covermode=atomic -coverprofile=coverage.txt
          go tool cover -func=coverage.txt | tee coverage_summary.txt
          # Extract total coverage for job summary
          total=$(grep '^total:' coverage_summary.txt | awk '{print $3}')
          echo "Total coverage: $total" >> $GITHUB_STEP_SUMMARY

      - name: Vet
        run: go vet ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.txt
            coverage_summary.txt

      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: coverage.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
