name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      
      - name: Install dependencies
        run: go mod download

      - name: Run unit tests with coverage
        run: |
          go test -race ./... -count=1 -covermode=atomic -coverprofile=coverage.txt
          go tool cover -func=coverage.txt | tee coverage_summary.txt
          # Extract total coverage for job summary
          total=$(grep '^total:' coverage_summary.txt | awk '{print $3}')
          echo "Total coverage: $total" >> $GITHUB_STEP_SUMMARY

      - name: Vet
        run: go vet ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.txt
            coverage_summary.txt

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
          disable_search: true
          flags: unittests
          verbose: true
          fail_ci_if_error: true
