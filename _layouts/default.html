<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <div class="site-layout">
      {%- if page.layout == 'docs' -%}

      <main class="main-content" aria-label="Content">
        <div class="wrapper">
          {{ content }}

    </div>

    {%- include footer.html -%}

  </body>

</html>
