<ul class="social-media-list">
  {%- if site.repository -%}
  <li>
    <a href="https://github.com/{{ site.repository }}">
      <svg class="svg-icon">
        <use xlink:href="{{ '/assets/minima-social-icons.svg#github' | relative_url }}"></use>
      </svg>
      <span class="username">{{ site.repository }}</span>
    </a>
  </li>
  {%- endif -%}
  
  {%- if site.twitter_username -%}
  <li>
    <a href="https://twitter.com/{{ site.twitter_username }}">
      <svg class="svg-icon">
        <use xlink:href="{{ '/assets/minima-social-icons.svg#twitter' | relative_url }}"></use>
      </svg>
      <span class="username">{{ site.twitter_username }}</span>
    </a>
  </li>
  {%- endif -%}
</ul>
